name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare native build tools
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          choco install nasm strawberryperl --yes --no-progress
          "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check, test and build Windows x64
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --version
          perl -v
          nasm -v
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib
          cargo build --release --locked --bin kafunekafka

      - name: Package portable application
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/package_windows.py --tag $env:GITHUB_REF_NAME
          } else {
            python scripts/package_windows.py
          }

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kafunekafka-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $existingDraft = gh release view $env:GITHUB_REF_NAME --json isDraft --jq .isDraft 2>$null
          $exists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if ($exists) {
            if ($existingDraft -eq 'true') {
              throw 'A draft release already exists. Complete or remove it before publishing this tag again.'
            }
            Write-Output 'This release is already published; preserving its existing assets.'
            exit 0
          }
          $assets = @(Get-ChildItem -Path dist -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "kafunekafka $env:GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
